<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="chrono-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="100%" stop-color="#18191E"/>
    </linearGradient>
    <pattern id="hud-grid-chrono" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(255, 255, 255, 0.1)"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#chrono-grad)"/>
  <rect width="800" height="450" fill="url(#hud-grid-chrono)"/>

  <!-- Schematic Bounding Frame -->
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="45" y="55" fill="#FF6B00" font-family="monospace" font-size="12" letter-spacing="2">SYS.02 // CHRONODRIFT TEMPORAL ENGINE</text>
  <text x="590" y="55" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">DETERMINISTIC // 60 FPS</text>

  <!-- Physics Coordinates & Trajectory Paths -->
  <!-- Wireframe coordinate plane -->
  <g stroke="rgba(255, 107, 0, 0.2)" stroke-width="1">
    <line x1="100" y1="320" x2="700" y2="320"/>
    <line x1="200" y1="370" x2="600" y2="170"/>
    <line x1="400" y1="100" x2="400" y2="360"/>
  </g>

  <!-- Temporal Frame Rewind Trail -->
  <path d="M 120 280 Q 260 140 400 220 T 680 160" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="6,6"/>
  <path d="M 120 280 Q 260 140 400 220 T 520 205" fill="none" stroke="#FF6B00" stroke-width="3"/>

  <!-- Keyframe snapshots -->
  <circle cx="120" cy="280" r="6" fill="#121316" stroke="#FF6B00" stroke-width="2"/>
  <text x="105" y="305" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">T-300ms</text>

  <circle cx="260" cy="180" r="7" fill="#121316" stroke="#FF6B00" stroke-width="2"/>
  <text x="245" y="205" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">T-150ms</text>

  <circle cx="400" cy="220" r="8" fill="#121316" stroke="#FF6B00" stroke-width="2"/>
  <text x="385" y="245" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">T-50ms</text>

  <!-- Current Frame Kinetic Particle Node -->
  <circle cx="520" cy="205" r="10" fill="#FF6B00"/>
  <circle cx="520" cy="205" r="18" fill="none" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="535" y="195" fill="#FFB693" font-family="monospace" font-size="11" font-weight="bold">ACTIVE TICK // #41,204</text>

  <!-- Vector directional arrow -->
  <line x1="520" y1="205" x2="570" y2="185" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <polygon points="570,185 558,183 564,192" fill="#10B981"/>
  <text x="575" y="180" fill="#10B981" font-family="monospace" font-size="10">VELOCITY: 48.2 m/s</text>

  <!-- Telemetry HUD readout bar -->
  <rect x="45" y="355" width="220" height="50" fill="#121316" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="60" y="375" fill="rgba(255, 255, 255, 0.4)" font-family="monospace" font-size="10">REWIND BUFFER</text>
  <text x="60" y="395" fill="#F3F4F6" font-family="monospace" font-size="15" font-weight="bold">1,024 TICKS <tspan fill="#10B981" font-size="11">SYNC</tspan></text>

  <rect x="280" y="355" width="220" height="50" fill="#121316" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="295" y="375" fill="rgba(255, 255, 255, 0.4)" font-family="monospace" font-size="10">WASM HEAP</text>
  <text x="295" y="395" fill="#F3F4F6" font-family="monospace" font-size="15" font-weight="bold">4.2 MB <tspan fill="#FF6B00" font-size="11">OPTIMIZED</tspan></text>
</svg>
