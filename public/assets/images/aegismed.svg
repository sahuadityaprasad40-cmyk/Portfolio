<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aegis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="100%" stop-color="#18191E"/>
    </linearGradient>
    <pattern id="hud-grid-aegis" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#aegis-grad)"/>
  <rect width="800" height="450" fill="url(#hud-grid-aegis)"/>

  <!-- Schematic Bounding Frame -->
  <rect x="25" y="25" width="750" height="400" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <rect x="20" y="20" width="10" height="10" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
  <rect x="770" y="20" width="10" height="10" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
  <rect x="20" y="420" width="10" height="10" fill="none" stroke="#FF6B00" stroke-width="1.5"/>
  <rect x="770" y="420" width="10" height="10" fill="none" stroke="#FF6B00" stroke-width="1.5"/>

  <!-- Telemetry Header Banner -->
  <text x="45" y="55" fill="#FF6B00" font-family="monospace" font-size="12" letter-spacing="2">SYS.01 // AEGIS-MED TELEMETRY ENGINE</text>
  <text x="620" y="55" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">SAMPLING: 1000 HZ</text>

  <!-- ECG / Vitals Waveform Vector -->
  <path d="M 50 240 L 150 240 L 170 200 L 185 290 L 205 130 L 225 310 L 245 220 L 260 250 L 340 240 L 360 190 L 375 280 L 395 140 L 415 320 L 435 225 L 450 245 L 560 240 L 580 200 L 595 290 L 615 130 L 635 310 L 655 220 L 750 240" fill="none" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glow effect duplicate -->
  <path d="M 50 240 L 150 240 L 170 200 L 185 290 L 205 130 L 225 310 L 245 220 L 260 250 L 340 240 L 360 190 L 375 280 L 395 140 L 415 320 L 435 225 L 450 245 L 560 240 L 580 200 L 595 290 L 615 130 L 635 310 L 655 220 L 750 240" fill="none" stroke="#FF6B00" stroke-width="6" stroke-opacity="0.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Telemetry Nodes and Labels -->
  <circle cx="205" cy="130" r="4" fill="#FF6B00"/>
  <circle cx="415" cy="320" r="4" fill="#10B981"/>
  <circle cx="615" cy="130" r="4" fill="#FF6B00"/>

  <line x1="205" y1="130" x2="205" y2="80" stroke="#FF6B00" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="215" y="85" fill="#FFB693" font-family="monospace" font-size="11">PEAK QRS // 1.24 mV</text>

  <!-- Metric Dashboard Badges -->
  <rect x="45" y="360" width="160" height="45" fill="#121316" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="60" y="380" fill="rgba(255, 255, 255, 0.4)" font-family="monospace" font-size="10">HEART RATE</text>
  <text x="60" y="398" fill="#F3F4F6" font-family="monospace" font-size="16" font-weight="bold">72 BPM <tspan fill="#10B981" font-size="11">NORM</tspan></text>

  <rect x="220" y="360" width="160" height="45" fill="#121316" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="235" y="380" fill="rgba(255, 255, 255, 0.4)" font-family="monospace" font-size="10">SPO2 SATURATION</text>
  <text x="235" y="398" fill="#F3F4F6" font-family="monospace" font-size="16" font-weight="bold">99.4% <tspan fill="#10B981" font-size="11">STABLE</tspan></text>

  <rect x="395" y="360" width="160" height="45" fill="#121316" stroke="rgba(255, 255, 255, 0.08)" rx="4"/>
  <text x="410" y="380" fill="rgba(255, 255, 255, 0.4)" font-family="monospace" font-size="10">PREDICTIVE RISK</text>
  <text x="410" y="398" fill="#F3F4F6" font-family="monospace" font-size="16" font-weight="bold">0.03 <tspan fill="#10B981" font-size="11">LOW</tspan></text>
</svg>
